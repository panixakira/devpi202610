# Apache リバースプロキシ: http://<Pi の IP>/ → Node (127.0.0.1:3000)
# 設置: sudo cp deploy/apache-sogei.conf /etc/apache2/sites-available/sogei.conf
#       sudo a2enmod proxy proxy_http && sudo a2dissite 000-default && sudo a2ensite sogei && sudo systemctl reload apache2
<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ErrorLog  ${APACHE_LOG_DIR}/sogei_error.log
    CustomLog ${APACHE_LOG_DIR}/sogei_access.log combined
</VirtualHost>
